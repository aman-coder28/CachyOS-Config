include themes/noctalia.conf

# BEGIN_KITTY_FONTS
font_family      family='JetBrains Mono NL' postscript_name=JetBrainsMonoNL-ExtraLight
bold_font        family='JetBrains Mono NL' postscript_name=JetBrainsMonoNL-ExtraLight
italic_font      family='JetBrains Mono NL' postscript_name=JetBrainsMonoNL-ExtraLight
bold_italic_font family='JetBrains Mono NL' postscript_name=JetBrainsMonoNL-ExtraLight

font_size 12
window_margin_width 8
sync_to_monitor yes
input_delay 3
hide_window_decorations yes
copy_on_select clipboard

cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
custom_shaders cursor-trail-blaze
# END_KITTY_FONTS
