[backdrop]
blur_intensity = 0.0
tint_intensity = 0.99999997764825821

[bar.default]
border = "surface_variant"
border_width = 0.5
capsule = true
capsule_radius = 6
center = [ "workspaces", "notifications" ]
contact_shadow = true
end = [ "tray", "power_profile", "network", "volume", "brightness", "battery", "clock", "control-center" ]
font_family = "Adwaita Sans"
margin_ends = 0
padding = 8
panel_overlap = 0
radius = 0
shadow = false
start = [ "launcher", "active_window" ]

[control_center.calendar]
show_events_card = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "clipboard"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 168.0
    box_width = 200.0
    cx = 1259.0
    cy = 124.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background_padding = 20
        show_forecast = true

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
avatar_path = "/home/zeaman/Pictures/favicon.jpeg"
font_family = "Adwaita Sans"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "kcolorscheme", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "bat" ]

[wallpaper]
directory = "/home/zeaman/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/zeaman/Pictures/Wallpapers/toronto.png"

    [wallpaper.last]
    path = "/home/zeaman/Pictures/Wallpapers/toronto.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/zeaman/Pictures/Wallpapers/toronto.png"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.brightness]
scale = 1.1500000000000001
show_label = false

[widget.clock]
format = "{:%I:%M %p}"
timezone = "Africa/Addis_Ababa"

[widget.launcher]
anchor = true
capsule = true
capsule_padding = 4
capsule_radius = 5
custom_image = "/home/zeaman/Downloads/Bazzite_Logo.svg"
scale = 1.45

[widget.network]
scale = 1.25
show_label = false

[widget.tray]
hide_passive = false

[widget.volume]
scale = 1.05
show_label = false
